<svg class="diagram wide" viewBox="0 0 982 190" role="img" aria-labelledby="loopw-t loopw-d" xmlns="http://www.w3.org/2000/svg"><title id="loopw-t">The configuration control loop</title><desc id="loopw-d">Five stages in order: declare the configuration in a registry and profile, dry-run by default, apply only inside a marked sandbox, verify independently by recomputing, and report drift and status. Apply is the only stage that writes. A separate path runs from the declaration to verification, because verification recomputes the expected state from the declaration rather than reading the apply result.</desc><defs><marker id="loopw-ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 Z" class="hd"/></marker></defs><rect x="10" y="46" width="150" height="72" class="blk"/><text x="85.0" y="79" text-anchor="middle" class="bl">DECLARE</text><text x="85.0" y="101" text-anchor="middle" class="bs">registry + profile</text><path d="M160 82 H201" class="ln" marker-end="url(#loopw-ah)"/><rect x="202" y="46" width="150" height="72" class="blk"/><text x="277.0" y="79" text-anchor="middle" class="bl">DRY-RUN</text><text x="277.0" y="101" text-anchor="middle" class="bs">preview by default</text><path d="M352 82 H393" class="ln" marker-end="url(#loopw-ah)"/><rect x="394" y="46" width="150" height="72" class="blk hot"/><text x="469.0" y="79" text-anchor="middle" class="bl hotl">APPLY</text><text x="469.0" y="101" text-anchor="middle" class="bs hotl">sandbox only</text><path d="M544 82 H585" class="ln" marker-end="url(#loopw-ah)"/><rect x="586" y="46" width="150" height="72" class="blk"/><text x="661.0" y="79" text-anchor="middle" class="bl">VERIFY</text><text x="661.0" y="101" text-anchor="middle" class="bs">recompute</text><path d="M736 82 H777" class="ln" marker-end="url(#loopw-ah)"/><rect x="778" y="46" width="150" height="72" class="blk"/><text x="853.0" y="79" text-anchor="middle" class="bl">REPORT</text><text x="853.0" y="101" text-anchor="middle" class="bs">drift + status</text><path d="M85 118 V158 H661.0 V120" class="ln dash" marker-end="url(#loopw-ah)"/><text x="373.0" y="180" text-anchor="middle" class="bn">EXPECTED STATE RECOMPUTED FROM THE DECLARATION</text><text x="491" y="24" text-anchor="middle" class="bn hott">ONLY STAGE THAT WRITES</text><path d="M491 31 V44" class="ln hotln"/></svg>
