<svg class="diagram wide" viewBox="0 0 760 304" role="img" aria-labelledby="planesw-t planesw-d" xmlns="http://www.w3.org/2000/svg"><title id="planesw-t">Two control planes</title><desc id="planesw-d">Portable policy, covering identity, scope, desired state, and evidence rules, feeds two tool adapters: the Claude Code adapter, made of hooks and context, and the Codex adapter, made of instructions and sandbox settings. Advisory context fails open. Both adapters feed the repository-local gates, the durable evidence boundary, where controls that prevent a write fail closed.</desc><defs><marker id="planesw-ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 Z" class="hd"/></marker></defs><rect x="230" y="10" width="300" height="66" class="blk"/><text x="380" y="39" text-anchor="middle" class="bl">PORTABLE POLICY</text><text x="380" y="61" text-anchor="middle" class="bs">identity · scope · desired state · evidence</text><path d="M380 76 V100 H170 M380 100 H590" class="ln"/><path d="M170 100 V124" class="ln" marker-end="url(#planesw-ah)"/><path d="M590 100 V124" class="ln" marker-end="url(#planesw-ah)"/><rect x="40" y="126" width="260" height="66" class="blk"/><text x="170" y="155" text-anchor="middle" class="bl">CLAUDE CODE ADAPTER</text><text x="170" y="177" text-anchor="middle" class="bs">hooks and context</text><rect x="460" y="126" width="260" height="66" class="blk"/><text x="590" y="155" text-anchor="middle" class="bl">CODEX ADAPTER</text><text x="590" y="177" text-anchor="middle" class="bs">instructions and sandbox</text><text x="380" y="155" text-anchor="middle" class="bn">ADVISORY</text><text x="380" y="171" text-anchor="middle" class="bn">FAILS OPEN</text><path d="M170 192 V214 H590 V192 M380 214" class="ln"/><path d="M380 214 V236" class="ln" marker-end="url(#planesw-ah)"/><rect x="230" y="238" width="300" height="62" class="blk hot"/><text x="380" y="265" text-anchor="middle" class="bl hotl">REPOSITORY-LOCAL GATES</text><text x="380" y="286" text-anchor="middle" class="bs hotl">write-preventing controls fail closed</text></svg>
