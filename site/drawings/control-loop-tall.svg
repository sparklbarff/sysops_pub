<svg class="diagram tall" viewBox="0 0 380 524" role="img" aria-labelledby="loopt-t loopt-d" xmlns="http://www.w3.org/2000/svg"><title id="loopt-t">The configuration control loop</title><desc id="loopt-d">Five stages in order: declare the configuration in a registry and profile, dry-run by default, apply only inside a marked sandbox, verify independently by recomputing, and report drift and status. Apply is the only stage that writes. A separate path runs from the declaration to verification, because verification recomputes the expected state from the declaration rather than reading the apply result.</desc><defs><marker id="loopt-ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 Z" class="hd"/></marker></defs><rect x="80" y="20" width="230" height="68" class="blk"/><text x="195.0" y="50" text-anchor="middle" class="bl">DECLARE</text><text x="195.0" y="72" text-anchor="middle" class="bs">registry + profile</text><path d="M195.0 88 V123" class="ln" marker-end="url(#loopt-ah)"/><rect x="80" y="124" width="230" height="68" class="blk"/><text x="195.0" y="154" text-anchor="middle" class="bl">DRY-RUN</text><text x="195.0" y="176" text-anchor="middle" class="bs">preview by default</text><path d="M195.0 192 V227" class="ln" marker-end="url(#loopt-ah)"/><rect x="80" y="228" width="230" height="68" class="blk hot"/><text x="195.0" y="258" text-anchor="middle" class="bl hotl">APPLY</text><text x="195.0" y="280" text-anchor="middle" class="bs hotl">sandbox only</text><path d="M195.0 296 V331" class="ln" marker-end="url(#loopt-ah)"/><rect x="80" y="332" width="230" height="68" class="blk"/><text x="195.0" y="362" text-anchor="middle" class="bl">VERIFY</text><text x="195.0" y="384" text-anchor="middle" class="bs">recompute</text><path d="M195.0 400 V435" class="ln" marker-end="url(#loopt-ah)"/><rect x="80" y="436" width="230" height="68" class="blk"/><text x="195.0" y="466" text-anchor="middle" class="bl">REPORT</text><text x="195.0" y="488" text-anchor="middle" class="bs">drift + status</text><path d="M80 54 H40 V366 H79" class="ln dash" marker-end="url(#loopt-ah)"/><text transform="translate(28 210.0) rotate(-90)" text-anchor="middle" class="bn">RECOMPUTED FROM THE DECLARATION</text><text x="322" y="258" class="bn hott">ONLY</text><text x="322" y="274" class="bn hott">WRITER</text></svg>
