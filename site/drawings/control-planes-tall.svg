<svg class="diagram tall" viewBox="0 0 380 470" role="img" aria-labelledby="planest-t planest-d" xmlns="http://www.w3.org/2000/svg"><title id="planest-t">Two control planes</title><desc id="planest-d">Portable policy, covering identity, scope, desired state, and evidence rules, feeds two tool adapters: the Claude Code adapter, made of hooks and context, and the Codex adapter, made of instructions and sandbox settings. Advisory context fails open. Both adapters feed the repository-local gates, the durable evidence boundary, where controls that prevent a write fail closed.</desc><defs><marker id="planest-ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 Z" class="hd"/></marker></defs><rect x="20" y="10" width="340" height="84" class="blk"/><text x="190" y="42" text-anchor="middle" class="bl">PORTABLE POLICY</text><text x="190" y="64" text-anchor="middle" class="bs">identity · scope</text><text x="190" y="82" text-anchor="middle" class="bs">desired state · evidence</text><path d="M190 94 V116 H100 M190 116 H280" class="ln"/><path d="M100 116 V138" class="ln" marker-end="url(#planest-ah)"/><path d="M280 116 V138" class="ln" marker-end="url(#planest-ah)"/><rect x="20" y="140" width="160" height="96" class="blk"/><text x="100" y="172" text-anchor="middle" class="bl">CLAUDE CODE</text><text x="100" y="192" text-anchor="middle" class="bl">ADAPTER</text><text x="100" y="216" text-anchor="middle" class="bs">hooks, context</text><rect x="200" y="140" width="160" height="96" class="blk"/><text x="280" y="172" text-anchor="middle" class="bl">CODEX</text><text x="280" y="192" text-anchor="middle" class="bl">ADAPTER</text><text x="280" y="216" text-anchor="middle" class="bs">instructions, sandbox</text><path d="M100 236 V284 H280 V236" class="ln"/><path d="M190 284 V318" class="ln" marker-end="url(#planest-ah)"/><rect x="20" y="320" width="340" height="84" class="blk hot"/><text x="190" y="354" text-anchor="middle" class="bl hotl">REPOSITORY-LOCAL GATES</text><text x="190" y="378" text-anchor="middle" class="bs hotl">write-preventing controls</text><text x="190" y="394" text-anchor="middle" class="bs hotl">fail closed</text><text x="190" y="436" text-anchor="middle" class="bn">ADAPTERS: ADVISORY CONTEXT</text><text x="190" y="454" text-anchor="middle" class="bn">FAILS OPEN</text></svg>
